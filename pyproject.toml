[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-evidence-scanner"
version = "0.1.0"
description = "Offline-first local image evidence scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11", "c2pa-python>=0.39,<0.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

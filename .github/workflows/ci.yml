name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: python -m pip install -e ".[dev]"
      - run: python -m image_evidence_scanner --help
      - name: test scans with outbound traffic blocked
        shell: bash
        run: |
          sudo iptables -I OUTPUT 1 -j REJECT
          trap 'sudo iptables -D OUTPUT 1' EXIT
          python -m pytest -q
          sudo iptables -nvxL OUTPUT | awk '$3 == "REJECT" { packets += $1 } END { exit packets != 0 }'
      - run: ruff check .
      - run: ruff format --check .
